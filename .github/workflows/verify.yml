name: verify

on:
  push:
  workflow_dispatch:

jobs:
  finite-layer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Check the short paper's explicit finite constructions
        run: python3 paper/scripts/check_short_proof.py --max 150
      - name: Correspondence check (paper declarations exist in Lean)
        working-directory: paper/scripts
        run: python3 check_correspondence.py

  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://github.com/leanprover/elan/releases/latest/download/elan-x86_64-unknown-linux-gnu.tar.gz | tar xz
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Get Mathlib cache
        working-directory: lean
        run: lake exe cache get
      - name: Build (kernel-checked, no native_decide)
        working-directory: lean
        run: lake build
      - name: Axiom audit
        working-directory: lean
        run: |
          lake env lean Erdos1112Proof/AxiomsCheck.lean | tee axioms.txt
          python3 ../paper/scripts/check_axioms.py axioms.txt
